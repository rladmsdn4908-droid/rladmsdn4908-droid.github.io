              <p style="margin: 0; font-size: 16px; line-height: 1.95">손과 잡초라는 두 형상을 통해 관계가 생겨나고 변해가는 과정을 담아낸 전시. 두 형상이 관계를 맺어가는 과정을 접촉, 중첩, 침투, 침식, 생성, 해체의 여섯 단계로 펼쳐 놓는다.</p>

          <!-- 서문 -->
          <section style="display: flex; flex-wrap: wrap; gap: 32px 80px">
            <div style="flex: 1 1 240px; max-width: 360px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #111111; padding-top: 24px">

            <div style="flex: 999 1 520px; min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 28px; padding-top: 24px; font-size: 17px; line-height: 2.05">
              <p style="margin: 0; font-size: 22px; line-height: 1.9">종종 누군가를 이해했다고 믿는다. 그러나 그 순간에도 관계는 이미 다른 곳으로 흘러가고 있다. 하나의 이름으로 붙잡힌 관계는 멈춘 듯 보이지만, 그 아래에서는 보이지 않는 잡초의 뿌리처럼 쉼 없이 뻗고 갈라지며 새로운 길을 낸다.</p>
              <p style="margin: 0">〈형상은 무너지고, 흔적은 자란다〉는 손과 잡초라는 두 형상을 통해 관계가 생겨나고 변해가는 과정을 담아낸 전시이다. 손은 타인에게 닿으려는 신체의 의지이자 감각의 통로이며, 잡초는 예측할 수 없는 생명력과 통제할 수 없는 관계의 증식을 상징한다. 작업은 두 형상이 관계를 맺어가는 과정을 접촉, 중첩, 침투, 침식, 생성, 해체의 여섯 단계로 펼쳐 놓는다. 이는 땅에 뿌리를 내리고, 서로 뒤엉키며 틈을 파고들고, 마침내 시들어 흩어지면서도 씨앗을 남기는 잡초의 생애에서 비롯된 것으로, 그 생태적 특성을 관계의 형성과 변화 과정에 겹쳐 놓은 것이다.</p>
              <p style="margin: 0">관계는 땅에 떨어진 씨앗이 처음 흙에 닿듯, 두 형상이 각자의 윤곽을 지닌 채 조심스럽게 맞닿는 접촉에서 시작된다. 중첩의 단계에서는 이웃한 풀들이 서로 엉켜 자라듯 손의 선과 잡초의 선이 포개지며 어느 쪽에 속하는지 분간하기 어려운 지점이 생겨난다. 이어지는 침투에서는 잡초의 줄기가 손가락 사이로 스며드는 듯한 형상이 다른 형상의 영역 안으로 들어선다. 겹침과 스밈이 거듭되며 관계는 침식으로 나아간다. 잡초의 뿌리가 단단한 땅을 허물어 가듯 경계는 서서히 흐려지고, 손도 잡초도 아닌 혼성의 형상이 드러난다. 생성의 단계에서 그 형상은 빛을 향해 꽃을 피우듯 빛을 머금은 새로운 모습으로 떠오르지만, 마지막 해체에서는 흩어지며 빛이 머물던 자리가 어둠으로 바뀐다. 그럼에도 시든 잡초가 그 자리에 씨앗을 남기듯, 사라진 자리에는 흔적이 희미하게 남는다.</p>
              <p style="margin: 0">이 여섯 단계는 차례로 이어지는 듯 보이지만, 하나의 화면 안에서도 어떤 부분은 막 맞닿기 시작하고 어떤 부분은 이미 흩어져 간다. 내가 너에게 스며드는 순간 너 또한 나를 허물고 있듯, 다가가는 일과 무너지는 일은 서로 떨어져 있지 않다. 그렇게 서로에게 남긴 흔적은 이전과는 다른 ‘나’와 ‘너’, 그리고 ‘우리’를 만들어 낸다.</p>
              <p style="margin: 0">이 전시는 서로에게 남겨진 흔적을 기록하며, 관계 속에서 끊임없이 달라지는 경계의 궤적을 따라간다. 서로 다른 존재가 만나 영향을 주고받는 과정에서 경계는 형성되고 허물어지기를 반복하며, 그 안에서 각자의 모습 또한 달라진다. 이를 통해 하나의 모습으로 규정할 수 없는 존재와 관계의 변화를 살펴보고, 서로의 만남이 남기는 흔적과 그 의미를 드러내고자 한다.</p>

              <span style="font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 0.32em; color: #6B6B6B">EXHIBITION TEXT</span>

            <div style="flex: 999 1 520px; min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 28px; padding-top: 24px; font-size: 17px; line-height: 2.05">
              <p style="margin: 0; font-size: 22px; line-height: 1.9">세상은 끊임없이 우리에게 나아갈 방향을 묻는다. 어디로 나아가고 있는지, 길을 똑바로 걷고 있는지 확인받으면서, 길에서 탈선하지 말고 목적지를 향해 가야 한다고 요구받는 세상에서 살고 있다.</p>
              <p style="margin: 0">〈길을 잃은 사람들〉은 미술대학 졸업을 위한 논문을 마치고, 레지던시를 끝낸 후 더 이상 나아갈 곳을 찾지 못한 두 명의 작가를 소개한다. 냉혹한 현실 속에서 길을 잃은 이들은 더 이상 자신이 누구인지, 무엇을 위해 작업하는지 알 수 없는 혼란에 빠진다.</p>
              <p style="margin: 0">전시 속 두 작가의 작업에서는 시간은 우리 삶의 모든 순간을 관통하며, 기억은 그 시간의 흐름 속에서 형성된 흔적이다. 시간 속에서 자신을 찾고, 기억 속에서 존재를 확인하며, 그 흔적을 통해 현재를 살아간다. 〈길을 잃은 사람들〉전은 각각의 작업을 통해 시간과 기억, 그리고 그 안에 담긴 존재의 흔적을 탐구하는 전시이다. 이번 전시를 통해 이러한 혼돈 속에서 서 있는 두 작가의 내면을 들여다보고자 한다. 현실과 타협하며 살아가느라 점점 희미해진 작업의 열정, 작가로서의 정체성을 잃어가는 과정, 그리고 그 속에서 다시 자신을 찾고자 하는 몸부림을 담아낸다. 단순한 작품의 나열이 아닌, 숨겨진 곳에서 자신과 작품을 찾아가는 과정을 볼 수 있다.</p>
              <p style="margin: 0">전혜림 작가는 ‘나, 증거’ 시리즈를 통해 자신의 존재를 사진과 기억 속에서 찾고자 한다. 그녀의 작업은 시간의 흐름 속에서 변질된 기억을 재구성하고, 그 기억을 통해 자신의 존재를 증명하려는 시도이다. 사진이라는 매체는 순간을 포착해 시간의 흐름을 멈추는 동시에, 그 순간을 기억 속에서 왜곡하거나 변형시킬 수도 있다. 전혜림은 이 모순된 특성을 활용해 자신의 자아를 탐구하고, 존재의 흔적을 남기는 작업을 이어가고 있다.</p>
              <p style="margin: 0">김은우 작가는 잡초라는 자연의 생명체를 통해 시간과 생존, 그리고 인간의 관계성을 다룬다. 잡초는 끊임없이 변화하는 환경 속에서 자라며, 그 과정에서 다양한 기억과 흔적을 남긴다. 김은우는 이러한 잡초의 생명력을 통해 자신의 삶과 타인과의 관계를 비유하고, 시간의 흐름 속에서 형성된 타인과 자신의 ego를 탐구한다. 그의 작업은 불안정한 삶 속에서도 꿋꿋이 살아가는 인간의 모습과 그 흔적을 포착하려는 시도이다.</p>
              <p style="margin: 0">〈길을 잃은 사람들〉은 두 작가가 시간 속에서 자신과 타인의 존재를 탐구하고, 그 기억과 흔적을 통해 삶의 의미를 재해석하는 과정을 보여준다. 탈출구를 찾기 위한 전시임과 동시에 확신과 탈선 없는 삶을 살아가기를 강요하는 세상에서 살고 있는 사람들을 위한 전시이다. 모두가 시간 속에서 남기는 흔적과 그 기억이 어떻게 현재를 구성하는지를 생각해볼 수 있는 기회를 제공하고자 한다. 전시 속 두 작가의 작업을 통해 당신도 자신이 남긴 흔적과 그 속에서 형성된 기억을 새롭게 바라볼 수 있기를 바라며, 작가 본인들의 그 끝에서 새로운 길을 찾을 수 있을지 기대하며 이 전시를 통해 삶의 새로운 방향을 모색해 볼 수 있길 바란다.</p>
