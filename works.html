    earlier.forEach(([t, y, a, b, m]) => works.push({

        series: '드로잉'
      });

    const active = this.state.active;

      open: () => this.setState({ open: i })
    }));
    const n = list.length;
    const oi = this.state.open;
    const cur = oi >= 0 && oi < n ? list[oi] : null;
    const Z = 2.6, R = 120;
    const lens = this.state.lens;
    const viewer = cur ? {
      lensOn: !!(lens && cur.hasImg),
      lx: lens ? (lens.x - R) + 'px' : '0px',
      ly: lens ? (lens.y - R) + 'px' : '0px',
      ix: lens ? (R - lens.x * Z) + 'px' : '0px',
      iy: lens ? (R - lens.y * Z) + 'px' : '0px',
      iw: lens ? (lens.w * Z) + 'px' : '0px',
      ih: lens ? (lens.h * Z) + 'px' : '0px',
      move: (e) => {
        const t = e.touches && e.touches[0] ? e.touches[0] : e;
        const r = e.currentTarget.getBoundingClientRect();
        const x = t.clientX - r.left, y = t.clientY - r.top;
        if (x < 0 || y < 0 || x > r.width || y > r.height) { this.setState({ lens: null }); return; }
        this.setState({ lens: { x, y, w: r.width, h: r.height } });
      },
      leave: () => this.setState({ lens: null }),
      block: (e) => { e.preventDefault(); },
      touchStart: (e) => { this._vx = e.touches && e.touches[0] ? e.touches[0].clientX : null; },

      on: true,
      count: (oi + 1) + ' / ' + n,
      title: cur.title, meta: cur.meta, size: cur.size, img: cur.img, ratio: cur.ratio,
      hasImg: cur.hasImg, noImg: cur.noImg,
      close: () => this.setState({ open: -1, lens: null }),
      prev: () => this.setState({ open: (oi - 1 + n) % n, lens: null }),
      next: () => this.setState({ open: (oi + 1) % n, lens: null })
    } : { on: false };
    return {
      viewer,
      filters: labels.map((l) => ({
        label: l,
        count: l === '전체' ? works.length : works.filter((w) => w.series === l).length,
        color: l === active ? '#111111' : '#6B6B6B',
        pick: () => this.setState({ active: l, open: -1 })
      })),
      showGrid: true,
      shown: list
    };
  }
}
</script>
</body>
</html>
