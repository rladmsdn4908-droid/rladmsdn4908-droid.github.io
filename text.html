          <div style="display: flex; flex-direction: column; gap: 28px; font-size: 17px; line-height: 2.05">
              <p style="margin: 0">나는 어릴 적부터 포옹이나 손깍지 같은 애정 표현을 낯설어했고, 스킨십에 늘 어색함과 불편함을 느끼며 살아왔다. 특별한 계기가 있었던 것도 아닌데 누군가 다가오면 몸이 먼저 멈칫했고, 나는 그런 순간들을 오랫동안 회피해 왔다. 타인과의 거리를 유지하는 것이 자연스러웠고, 그 거리 안에서 나름의 질서를 만들어 갔다. 그러던 중 길가와 틈새에서 자라는 잡초들이 눈에 들어왔다. 비좁은 틈에서도 뿌리를 내리고, 서로 얽히고 기대며 함께 버텨내는 그 모습은 사람들과 닿는 것을 피해 온 나와는 정반대였다. 잡초를 들여다보며 나는 나 자신을 돌아보게 되었고, 외면해 왔던 불편함을 이제는 정면으로 마주하기로 했다.</p>
              <p style="margin: 0">잡초는 구석진 곳이든 갈라진 틈이든 비집고 들어갈 자리만 있다면 어디에나 뿌리를 내리고 스스로 터전을 만들어 간다. 저마다 다른 모양과 색을 지녔지만, ‘잡초’라는 이름으로 묶이는 순간 각자의 개성은 지워진다. 가까이 들여다보면 잎의 모양과 줄기의 방향, 뿌리가 뻗어 나가는 방식까지 어느 하나 같은 것이 없지만, 우리는 그것들을 하나의 이름으로 쉽게 구분하고 정의한다. 그럼에도 잡초는 스스로 한계를 두지 않고, 주어진 환경을 이용하기도 하고 그 환경에 영향을 받기도 하며 자신만의 방식으로 살아간다. 나는 이러한 모습이 사람을 바라보는 방식과도 닮았다고 느꼈다. 누군가를 이해했다고 생각하는 순간에도 그 사람에게는 내가 알지 못하는 수많은 모습이 남아 있을 것이다. 서로의 영역을 침범하면서도 때로는 기대어 자라고, 각자의 방향으로 뻗어 나가면서도 하나의 군집을 이루는 모습은 관계 속에서 살아가는 사람들의 모습과 닮아 있었다. 그래서 나의 손을 시작으로, 주변 사람들과 한 사람씩 손깍지를 끼며 서로의 감각을 살펴보기 시작했다. 평소에는 아무렇지 않게 지나쳤을 순간을 의식적으로 손깍지를 끼고 서로의 눈을 마주하자, 불편함을 넘어선 낯선 감각들이 밀려왔다. 손가락 사이의 예민한 속살이 맞닿는 찰나에는 친밀함과 긴장, 안정과 불안이 동시에 얽혀 있었다. 손의 크기와 두께, 피부의 온도와 습도, 손가락이 맞물리는 방식에 따라 느껴지는 감각은 조금씩 달랐다. 같은 손깍지라는 행위 안에서도 상대에 따라 감각의 차이가 생겨났고, 그 차이는 내가 상대를 인식하는 방식에도 영향을 주었다. 처음에는 불편함을 확인하기 위해 시작한 행위였지만, 반복되는 접촉 속에서 나는 그동안 미처 의식하지 못했던 감각들을 발견하게 되었다.</p>
              <p style="margin: 0">만남은 일시적이지만, 그 안에서 발생하는 감각은 결코 가볍지 않았다. 나는 손깍지를 끼던 순간의 감정을 기록하고 다시 들여다보며 의미를 부여했고, 그 과정에서 ‘잡초’와 ‘손’ 사이의 접점을 찾아보고자 했다. 잡초가 틈을 비집고 들어가 서로 뒤엉키며 자라듯, 손깍지 역시 손가락 사이의 틈으로 서로를 받아들이며 얽힌다. 서로 다른 두 손이 맞닿는 순간 각자의 경계는 여전히 존재하지만, 동시에 어느 한쪽만의 것으로 구분하기 어려운 영역이 만들어진다. 그 얽힘은 단순한 결합이 아니라 서로에게 기대면서도 밀어내는 관계의 감각이었다. 가까워지는 과정에는 낯섦과 긴장이 함께 존재하며, 서로를 받아들이는 일은 때로 자신의 익숙한 경계를 흔드는 일이기도 했다. 그러나 손과 손 사이에서 느낀 감각은 눈에 보이지 않고 말로도 온전히 설명하기 어려웠으며, 나의 불편함 또한 직접 드러내기 어려운 것이었다. 그래서 나는 억세면서도 자유롭게, 질서와 통제 밖에서 스스로 생명력을 확장하는 잡초의 형상을 빌려 그 감각에 형태를 입히고, 손을 통해 잡초의 얽힘에 관계의 의미를 더하고자 했다. 잡초가 틈 사이로 스며들어 뿌리를 내리고 자신의 터전을 만들어 가는 과정은 화면 위에 흔적으로 남는다. 또한 잡초에서 관찰한 다양한 초록의 색조와 결, 군집의 형상을 손에 입혀 서로 깍지를 낀 손들이 하나의 초록으로 물들어 가는 모습을 그린다. 하나의 초록처럼 보이지만, 가까이 들여다보면 서로 다른 수많은 초록이 겹쳐져 있음을 발견할 수 있다. 각기 다른 색과 결은 하나의 형상 안에서 겹쳐지고 섞이지만, 그 안에는 여전히 서로 다른 흔적들이 남아 있다. 나는 이러한 색의 중첩이 관계 속에서 서로 영향을 주고받으면서도 각자의 차이를 지닌 채 살아가는 존재들의 모습과 닮아 있다고 느꼈다. 화면 속 손과 잡초는 때로 분명한 윤곽을 유지하지만, 서로 얽히고 스며드는 과정에서 점차 구분하기 어려운 모습으로 변화한다. 형상이 만들어지고 허물어지는 과정은 관계 속에서 익숙했던 자신의 모습이 달라지는 경험과도 맞닿아 있다.</p>
              <p style="margin: 0">서로 기대고 버티는 잡초와 손들은 불안정한 상태 속에서도 관계를 지속하려는 힘을 드러낸다. 그러나 나는 그 관계가 언제나 조화롭거나 안정된 모습으로 유지된다고 생각하지 않는다. 서로에게 가까워지는 만큼 각자의 경계가 흔들리기도 하고, 그 과정에서 이전에는 알지 못했던 자신의 모습을 마주하기도 한다. 나 역시 손깍지를 통해 타인과의 접촉을 경험하면서, 불편함이 단순히 극복해야 할 감정만은 아니라는 사실을 조금씩 깨닫게 되었다. 그것은 내가 타인을 받아들이는 방식과 나 자신을 인식하는 과정을 다시 살펴보게 하는 하나의 감각이었다. 나는 그 얽힘 속에서 불편함 뒤에 숨어 있던 나를 조금씩 발견하며, 서로 다른 존재가 만나 영향을 주고받는 과정에서 달라지는 형상과 그 안에 남겨진 흔적을 화면에 담아내고자 한다.</p>
